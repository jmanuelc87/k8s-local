{{- if .Values.nfsServer.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: nfs-server
  namespace: {{ .Values.nfsNamespace | default "nfs-storage" }}
  labels:
    app: nfs-server
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: nfs-server
  ports:
  - name: nfs
    port: 2049
    targetPort: 2049
    protocol: TCP
{{- end }}
