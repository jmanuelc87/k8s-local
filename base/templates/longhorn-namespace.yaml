{{- if .Values.longhorn.enabled }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.longhornNamespace | default "longhorn-system" }}
  labels:
    app.kubernetes.io/name: longhorn
    app.kubernetes.io/component: storage
    app.kubernetes.io/managed-by: helm
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
  annotations:
    description: "Longhorn distributed block storage system for Kubernetes"
    managed-by: "helm"
    # Longhorn requires privileged access for block storage management
    # Pod security enforcement is intentionally disabled for this namespace
    pod-security-policy: privileged

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: longhorn-quota
  namespace: {{ .Values.longhornNamespace | default "longhorn-system" }}
spec:
  hard:
    requests.storage: {{ .Values.longhorn.storageQuota | default "500Gi" }}
    persistentvolumeclaims: {{ .Values.longhorn.pvcQuota | default "50" }}

---
apiVersion: v1
kind: LimitRange
metadata:
  name: longhorn-limits
  namespace: {{ .Values.longhornNamespace | default "longhorn-system" }}
spec:
  limits:
  - max:
      memory: "2Gi"
      cpu: "2000m"
    min:
      memory: "64Mi"
      cpu: "100m"
    # Without explicit defaults, Kubernetes uses max as the default request,
    # which makes every Longhorn container request 2 full CPUs.
    default:
      memory: "2Gi"
      cpu: "2000m"
    defaultRequest:
      memory: "128Mi"
      cpu: "200m"
    type: Container
  # No Pod-level max: Longhorn's multi-container pods (e.g. longhorn-csi-plugin
  # with 3 containers) inherit the Container default limit per container, and a
  # Pod max of 4 CPU / 4Gi would reject them outright. Container limits still cap
  # each container individually.

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-network-policy
  namespace: {{ .Values.longhornNamespace | default "longhorn-system" }}
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          app.kubernetes.io/name: longhorn
    - podSelector: {}
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
  - to:
    - podSelector: {}
{{- end }}
